<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2226"/>
      <stop offset="100%" stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- アプリアイコン背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>

  <!-- ピッチ戦術ボード風の微細なライン（背景装飾） -->
  <path d="M 64 256 L 448 256" stroke="rgba(255,255,255,0.05)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>

  <!-- ピッチグリーン・クレスト外枠 -->
  <path d="M 256 64 L 396 116 C 396 288 320 396 256 448 C 192 396 116 288 116 116 Z"
        fill="#1a1d20" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 内側シャドウ/アクセントフレーム -->
  <path d="M 256 86 L 374 130 C 374 274 308 368 256 412 C 204 368 138 274 138 130 Z"
        fill="#17191c" stroke="rgba(46, 204, 113, 0.25)" stroke-width="4" stroke-linejoin="round"/>

  <!-- 中央：タクティカル・サッカーボール幾何学ベクター -->
  <circle cx="256" cy="236" r="76" fill="#202428" stroke="#2ecc71" stroke-width="8"/>
  
  <!-- ボール中央の五角形 -->
  <polygon points="256,192 284,212 273,246 239,246 228,212" fill="#2ecc71"/>

  <!-- ボール縫い目ライン -->
  <line x1="256" y1="192" x2="256" y2="160" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
  <line x1="284" y1="212" x2="312" y2="202" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
  <line x1="273" y1="246" x2="298" y2="270" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
  <line x1="239" y1="246" x2="214" y2="270" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
  <line x1="228" y1="212" x2="200" y2="202" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>

  <!-- 「GM」ブランドバッジ -->
  <rect x="186" y="328" width="140" height="52" rx="10" fill="#2ecc71" filter="url(#glow)"/>
  <text x="256" y="365" font-family="'Roboto Mono', 'SF Pro Display', -apple-system, monospace, sans-serif"
        font-size="34" font-weight="900" fill="#14171a" text-anchor="middle" letter-spacing="3">GM</text>
</svg>
